<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>People's Jury</title>
<meta name="description" content="Two people. Two sides. You decide. Post a friendly dispute and let the public vote.">
<meta property="og:title" content="People's Jury">
<meta property="og:description" content="Two people. Two sides. You decide.">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e3a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta property="og:type" content="website">
<meta property="og:url" content="https://walterhendersonjr41-blip.github.io/peoples-jury/">
<meta property="og:image" content="https://walterhendersonjr41-blip.github.io/peoples-jury/og.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="People's Jury"><meta name="twitter:description" content="Two people. Two sides. You decide.">
<meta name="twitter:image" content="https://walterhendersonjr41-blip.github.io/peoples-jury/og.png">
<style>
:root{--ink:#111a33;--bg:#f4f2ec;--card:#fff;--a:#2563eb;--b:#d97706;--gold:#f5c542;--ok:#15803d;--muted:#5b6475;--line:#e6e2d8;--brand1:#1e3a8a;--brand2:#6d28d9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
header{background:linear-gradient(135deg,var(--brand1),var(--brand2));color:#fff;padding:14px 18px calc(14px + env(safe-area-inset-top,0));position:sticky;top:0;z-index:5;box-shadow:0 2px 14px rgba(20,20,60,.25)}
header .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
header a{color:#fff;text-decoration:none;font-size:24px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:10px}
header img{width:38px;height:38px;border-radius:10px}
header .tag{margin-left:auto;font-size:15px;opacity:.85}
main{max-width:640px;margin:0 auto;padding:16px 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin:0 0 16px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(17,26,51,.06)}
h1{font-size:30px;margin:4px 0 10px;line-height:1.2;letter-spacing:-.3px}
h2{font-size:23px;margin:4px 0 10px}
.muted{color:var(--muted);font-size:17px}
.small{font-size:16px}
.center{text-align:center}
.hidden{display:none!important}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:17px 16px;font-family:inherit;font-weight:700;font-size:21px;line-height:1.2;cursor:pointer;background:var(--ink);color:#fff;text-align:center;text-decoration:none;margin:10px 0;transition:transform .12s ease,box-shadow .2s ease,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.big{background:linear-gradient(135deg,var(--brand1),var(--brand2));font-size:23px;padding:20px;box-shadow:0 8px 22px rgba(76,29,149,.3)}
.btn.light{background:#ebe8e0;color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn.rec{background:#b91c1c;color:#fff;animation:pulse 1.2s infinite}
.row{display:flex;gap:12px}.row>*{flex:1;min-width:0}
.vote{font-size:22px;padding:18px 8px;line-height:1.2;color:#fff;overflow:hidden;text-overflow:ellipsis}
.vote b{display:block;font-size:50px;line-height:1;margin-bottom:4px}
.vote.sm{padding:12px 8px;font-size:19px}.vote.sm b{font-size:34px}
.vote.a{background:var(--a)}.vote.b{background:var(--b)}
label{display:block;font-weight:700;margin:16px 0 6px}
input[type=text],textarea,select{width:100%;font:inherit;padding:14px;border:2px solid #d6d1c4;border-radius:14px;background:#fff;color:var(--ink);transition:border-color .2s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand2)}
textarea{min-height:150px;resize:vertical}
.check{display:flex;gap:12px;align-items:flex-start;font-weight:400;font-size:17px;background:#f7f5ef;border-radius:14px;padding:12px}
.check input{width:28px;height:28px;flex:none;margin-top:2px;accent-color:var(--brand2)}
.side{border-left:7px solid var(--a);padding:2px 0 2px 14px;margin:18px 0}
.side.b{border-color:var(--b)}
.side h3{margin:0 0 6px;font-size:21px;display:flex;align-items:center;gap:8px}
.side p{margin:0;white-space:pre-wrap}
.num{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--a);color:#fff;font-size:18px}
.side.b .num{background:var(--b)}
.summary{background:#f3f0ff;border-radius:14px;padding:12px 14px;margin:14px 0}
.summary p{margin:4px 0 0}
.kicker{font-size:14px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--brand2);margin-bottom:4px}
.bar{display:flex;height:30px;border-radius:999px;overflow:hidden;background:#ebe8e0;margin:8px 0}
.bar.mini{height:14px}
.bar div{transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar .ba{background:linear-gradient(90deg,#1d4ed8,var(--a))}.bar .bb{background:linear-gradient(90deg,var(--b),#b45309)}
.tally{display:flex;justify-content:space-between;font-weight:700;gap:10px}
.tally #n1,.tally #n2{font-size:28px;font-variant-numeric:tabular-nums}
.verdict{background:linear-gradient(135deg,#fff8e1,#fff1c2);border:3px solid var(--gold);text-align:center}
.verdict .big{font-size:32px;font-weight:900;margin:6px 0}
.verline{font-style:italic;font-size:19px}
.disclaimer{font-size:15px;color:var(--muted);text-align:center;margin-top:14px;padding-top:10px;border-top:1px dashed var(--line)}
.notice{background:#eef6ee;border:1px solid #b7dbb7;border-radius:14px;padding:12px 14px;margin:10px 0;font-size:17px}
.warn{background:#fdecec;border-color:#f3b4b4}
.hero{text-align:center;background:linear-gradient(180deg,#fff,#faf8ff)}
.logo-big svg{width:84px;height:84px;filter:drop-shadow(0 8px 16px rgba(76,29,149,.25))}
.tabs{display:flex;gap:8px;margin:6px 0 14px;position:sticky;top:70px;z-index:4;background:var(--bg);padding:6px 0}
.tabs button{flex:1;font-family:inherit;font-weight:700;font-size:17px;padding:12px 6px;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:all .2s}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.feeditem .t{display:block;font-weight:800;font-size:22px;color:var(--ink);text-decoration:none;line-height:1.25}
.feeditem .sum{margin:8px 0;font-size:17px;color:#2d3550}
.meta{margin:4px 0}
.pill{display:inline-block;background:#ebe8e0;border-radius:999px;padding:3px 12px;font-size:15px;margin:2px 6px 2px 0}
.linkbox{word-break:break-all;background:#f1efe8;border-radius:12px;padding:10px;font-size:15px;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:16px;text-decoration:underline;cursor:pointer;padding:12px}
.check-big{font-size:56px;text-align:center}
.steps li,.rules li{margin:8px 0}
.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.94);opacity:.6}100%{transform:scale(1);opacity:1}}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(185,28,28,.15)}}
footer{text-align:center;color:var(--muted);font-size:15px;padding:10px 20px 40px}
footer a{color:var(--muted)}
@media (max-width:420px){h1{font-size:26px}.vote{font-size:19px}header .tag{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="in"><a href="#/"><img src="icons/icon-192.png" alt="">People's Jury</a><div class="tag">Two sides. You decide.</div></div></header>
<main id="app"><div class="card center">Loading…</div></main>
<footer>First names only · No real crimes or legal matters · For fun, not a legal ruling<br><a class="plain" href="#/rules">Rules</a></footer>
<script type="module" src="app.js"></script>
</body>
</html>
